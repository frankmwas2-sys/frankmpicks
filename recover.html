<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FM PICKS — Data Recovery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#0e0e14;color:#f0f0f0;padding:16px}
h1{font-size:20px;color:#f0c040;margin-bottom:4px;font-weight:700}
p{color:#888;font-size:12px;margin-bottom:16px;line-height:1.6}
.card{background:#1e1e2a;border:1px solid #2a2a3a;border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font-size:13px;color:#f0c040;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a2a3a;font-size:12px}
.row:last-child{border-bottom:none}
.lbl{color:#888}.val{color:#3dd68c;font-weight:600}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px}
.btn-scan{background:#f0c040;color:#000}
.btn-restore{background:#3dd68c;color:#000}
.btn-go{background:#4da6ff;color:#000}
.status{padding:12px 14px;border-radius:8px;font-size:12px;margin-bottom:12px;line-height:1.8}
.ok{background:#3dd68c22;border:1px solid #3dd68c;color:#3dd68c}
.err{background:#ff555522;border:1px solid #ff5555;color:#ff5555}
.warn{background:#f0c04022;border:1px solid #f0c040;color:#f0c040}
</style>
</head>
<body>
<h1>🔧 FM PICKS — Force Restore</h1>
<p>This will directly write your 278 sales and 32 restocks into the exact format the new app reads. Tap the button below.</p>

<button class="btn btn-scan" onclick="forceRestore()">⚡ FORCE RESTORE MY DATA NOW</button>

<div id="out"></div>

<script>
function uid(){return Date.now()+Math.random().toString(36).slice(2,6)}

function forceRestore(){
  const out=document.getElementById('out');
  out.innerHTML='<div class="status warn">⏳ Working...</div>';

  try{
    // Step 1: Read flat sales and restocks that recovery page already saved
    const rawSales=localStorage.getItem('fmp_sales');
    const rawRestocks=localStorage.getItem('fmp_restocks');
    const rawExpenses=localStorage.getItem('fmp_expenses');
    const rawDebts=localStorage.getItem('fmp_debts');
    const rawProducts=localStorage.getItem('fmp_products');

    const sales=JSON.parse(rawSales||'[]');
    const restocks=JSON.parse(rawRestocks||'[]');
    const expenses=JSON.parse(rawExpenses||'[]');
    const debts=JSON.parse(rawDebts||'[]');
    const products=JSON.parse(rawProducts||'[]');

    if(sales.length===0&&restocks.length===0){
      out.innerHTML='<div class="status err">❌ No flat sales/restocks found. Please run the recover.html scan and restore first, then come back here.</div>';
      return;
    }

    // Step 2: Define product IDs to use
    const prodIds=products.length>0
      ?products.map(p=>p.id)
      :['blazer','waistcoat','chiffon','sleeveless'];

    // Step 3: Build fmp_cycles from scratch — FORCE overwrite
    const newCycles={};

    prodIds.forEach(pid=>{
      const pR=restocks.filter(r=>r.product===pid).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      const pS=sales.filter(s=>s.product===pid);

      if(!pR.length&&!pS.length)return;

      newCycles[pid]=[];

      if(!pR.length){
        // No restocks — put all sales in one open cycle
        newCycles[pid].push({
          id:uid(),
          startDate:pS[0]?.date||'2024-01-01',
          endDate:null,
          restockCost:0,
          restockQty:0,
          carriedPcs:0,
          carriedCost:0,
          sales:pS.map(s=>({id:s.id||uid(),amount:s.amount||0,qty:s.qty||1,date:s.date}))
        });
      } else {
        pR.forEach((r,i)=>{
          const nR=pR[i+1];
          const cycleSales=pS.filter(s=>{
            return s.date>=r.date&&(nR?s.date<nR.date:true);
          });
          newCycles[pid].push({
            id:uid(),
            startDate:r.date,
            endDate:nR?nR.date:null,
            restockCost:r.cost||0,
            restockQty:r.qty||0,
            carriedPcs:0,
            carriedCost:0,
            sales:cycleSales.map(s=>({id:s.id||uid(),amount:s.amount||0,qty:s.qty||1,date:s.date}))
          });
        });
      }
    });

    // Step 4: FORCE write — delete old cycles first then write new
    localStorage.removeItem('fmp_cycles');
    localStorage.setItem('fmp_cycles',JSON.stringify(newCycles));

    // Also make sure expenses and debts are saved
    localStorage.setItem('fmp_expenses',JSON.stringify(expenses));
    localStorage.setItem('fmp_debts',JSON.stringify(debts));

    // Step 5: Verify what was written
    const written=JSON.parse(localStorage.getItem('fmp_cycles')||'{}');
    let totalSalesWritten=0,totalCycles=0;
    Object.values(written).forEach(cs=>{
      totalCycles+=cs.length;
      cs.forEach(c=>totalSalesWritten+=(c.sales||[]).length);
    });

    const totalSalesAmt=sales.reduce((a,s)=>a+s.amount,0);
    const totalRestockAmt=restocks.reduce((a,r)=>a+r.cost,0);

    out.innerHTML=`
      <div class="status ok">
        ✅ <strong>Force Restore Complete!</strong><br/><br/>
        Sales written: <strong>${totalSalesWritten} records</strong><br/>
        Cycles created: <strong>${totalCycles}</strong><br/>
        Total Sales: <strong>KES ${totalSalesAmt.toLocaleString()}</strong><br/>
        Total Restock: <strong>KES ${totalRestockAmt.toLocaleString()}</strong><br/>
        Expenses: <strong>${expenses.length}</strong><br/>
        Debts: <strong>${debts.length}</strong><br/><br/>
        Now tap the button below to open your app!
      </div>
      <button class="btn btn-go" onclick="window.location.href='https://frankmwas2-sys.github.io/frankmpicks'">🚀 OPEN FRANK M PICKS APP</button>`;

  }catch(e){
    out.innerHTML=`<div class="status err">❌ Error: ${e.message}</div>`;
  }
}
</script>
</body>
</html>
