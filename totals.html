<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FM PICKS — View Totals</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#0e0e14;color:#f0f0f0;padding:16px}
h1{font-size:20px;color:#f0c040;margin-bottom:4px;font-weight:700}
p{color:#888;font-size:12px;margin-bottom:16px;line-height:1.6}
.card{background:#1e1e2a;border:1px solid #2a2a3a;border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font-size:14px;color:#f0c040;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;padding-bottom:6px;border-bottom:1px solid #2a2a3a}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1a1a24;font-size:13px}
.row:last-child{border-bottom:none}
.lbl{color:#888}.val{font-weight:700}
.green{color:#3dd68c}.blue{color:#4da6ff}.red{color:#ff5555}.gold{color:#f0c040}.orange{color:#e06030}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;background:#f0c040;color:#000}
.total-row{display:flex;justify-content:space-between;padding:10px 0;font-size:15px;font-weight:700;border-top:2px solid #2a2a3a;margin-top:4px}
</style>
</head>
<body>
<h1>📊 FM PICKS — Your Totals</h1>
<p>This reads all your saved data and shows exact totals per product. Share a screenshot of this with Claude to set as your opening balance.</p>

<button class="btn" onclick="showTotals()">📊 SHOW MY TOTALS</button>

<div id="out"></div>

<script>
function showTotals(){
  const out=document.getElementById('out');

  const sales=JSON.parse(localStorage.getItem('fmp_sales')||'[]');
  const restocks=JSON.parse(localStorage.getItem('fmp_restocks')||'[]');
  const expenses=JSON.parse(localStorage.getItem('fmp_expenses')||'[]');
  const debts=JSON.parse(localStorage.getItem('fmp_debts')||'[]');
  const products=JSON.parse(localStorage.getItem('fmp_products')||'[]');

  const prods=products.length?products:[
    {id:'blazer',name:'Blazer'},
    {id:'waistcoat',name:'Waist Coat'},
    {id:'chiffon',name:'Chiffon Top'},
    {id:'sleeveless',name:'Sleeveless Blazer'}
  ];

  if(!sales.length&&!restocks.length){
    out.innerHTML='<div style="background:#ff555522;border:1px solid #ff5555;color:#ff5555;padding:12px;border-radius:8px">❌ No data found. Please run recover.html first to restore your data.</div>';
    return;
  }

  let html='';
  let grandSalesAmt=0,grandSalesPcs=0,grandRestockAmt=0,grandRestockPcs=0;

  prods.forEach(p=>{
    const pSales=sales.filter(s=>s.product===p.id);
    const pRestocks=restocks.filter(r=>r.product===p.id);

    const salesAmt=pSales.reduce((a,s)=>a+s.amount,0);
    const salesPcs=pSales.reduce((a,s)=>a+(s.qty||0),0);
    const restockAmt=pRestocks.reduce((a,r)=>a+r.cost,0);
    const restockPcs=pRestocks.reduce((a,r)=>a+(r.qty||0),0);
    const profit=salesAmt-restockAmt;

    grandSalesAmt+=salesAmt;
    grandSalesPcs+=salesPcs;
    grandRestockAmt+=restockAmt;
    grandRestockPcs+=restockPcs;

    html+=`<div class="card">
      <h3>${p.name}</h3>
      <div class="row"><span class="lbl">Restock Cost</span><span class="val orange">KES ${restockAmt.toLocaleString()}</span></div>
      <div class="row"><span class="lbl">Pieces Restocked</span><span class="val orange">${restockPcs} pcs</span></div>
      <div class="row"><span class="lbl">Total Sales</span><span class="val blue">KES ${salesAmt.toLocaleString()}</span></div>
      <div class="row"><span class="lbl">Pieces Sold</span><span class="val blue">${salesPcs} pcs</span></div>
      <div class="row"><span class="lbl">Profit / Loss</span><span class="val ${profit>=0?'green':'red'}">KES ${profit.toLocaleString()}</span></div>
    </div>`;
  });

  const totalExp=expenses.reduce((a,e)=>a+e.amount,0);
  const grandProfit=grandSalesAmt-grandRestockAmt-totalExp;

  html+=`<div class="card">
    <h3>📊 Grand Total — All Products</h3>
    <div class="row"><span class="lbl">Total Sales</span><span class="val blue">KES ${grandSalesAmt.toLocaleString()}</span></div>
    <div class="row"><span class="lbl">Pieces Sold</span><span class="val blue">${grandSalesPcs} pcs</span></div>
    <div class="row"><span class="lbl">Total Restock</span><span class="val orange">KES ${grandRestockAmt.toLocaleString()}</span></div>
    <div class="row"><span class="lbl">Pieces Restocked</span><span class="val orange">${grandRestockPcs} pcs</span></div>
    <div class="row"><span class="lbl">Expenses</span><span class="val red">KES ${totalExp.toLocaleString()}</span></div>
    <div class="total-row"><span class="gold">Net Profit</span><span class="${grandProfit>=0?'green':'red'}">KES ${grandProfit.toLocaleString()}</span></div>
  </div>`;

  // Also show debts
  if(debts.length){
    const given=debts.filter(d=>d.type==='given'&&!d.paid).reduce((a,d)=>a+d.amount,0);
    const received=debts.filter(d=>d.type==='received'&&!d.paid).reduce((a,d)=>a+d.amount,0);
    html+=`<div class="card">
      <h3>💳 Debts</h3>
      <div class="row"><span class="lbl">Given Out (unpaid)</span><span class="val orange">KES ${given.toLocaleString()}</span></div>
      <div class="row"><span class="lbl">Received (unpaid)</span><span class="val green">KES ${received.toLocaleString()}</span></div>
    </div>`;
  }

  out.innerHTML=html;
}
</script>
</body>
</html>
